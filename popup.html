<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f8f9fa;
    }
    h3 {
      margin-top: 0;
      color: #202124;
      font-size: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 5px;
    }
    input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
    }
    button {
      width: 100%;
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1557b0;
    }
    .status {
      font-size: 12px;
      color: #137333;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Asistente AI Gmail</h3>
  <div class="form-group">
    <label for="apiKey">OpenAI API Key:</label>
    <input type="password" id="apiKey" placeholder="sk-...">
  </div>
  <button id="saveBtn">Guardar Configuración</button>
  <div id="statusMsg" class="status">¡Guardado con éxito!</div>
  <script src="popup.js"></script>
</body>
</html>
